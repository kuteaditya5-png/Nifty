<!-- Optional: paste inside the existing F&O alert drawer -->
<div style="margin-top:16px;padding:14px;border:1px solid #2c405d;border-radius:12px">
  <div style="font-weight:700;margin-bottom:10px">WhatsApp Alerts</div>
  <div id="waUser" style="opacity:.8;margin-bottom:10px">
    Loading verified number...
  </div>

  <label>Alert type</label>
  <select id="waAlertType">
    <option value="BOTH">CE + PE</option>
    <option value="CE">CE only</option>
    <option value="PE">PE only</option>
  </select>

  <label>Minimum confidence %</label>
  <input id="waConfidence" type="number" min="0" max="100" value="70">

  <label>Preferred alert time</label>
  <input id="waAlertTime" type="time">

  <button onclick="saveWhatsAppSettings()">Save WhatsApp Settings</button>
  <button onclick="testWhatsAppAlert()">Send Test WhatsApp</button>
  <button onclick="evaluateWhatsAppSignal()">Check & Send Current Signal</button>
  <button onclick="logoutNifty()">Logout</button>
</div>

<script>
async function loadVerifiedUser(){
  const r = await fetch("/api/account/me");

  if(r.status === 401){
    location.href = "/login";
    return;
  }

  const d = await r.json();

  if(d.user){
    const m = d.user.mobile_number || "";
    document.getElementById("waUser").textContent =
      "Verified: " +
      (m.length > 6
        ? m.slice(0,4) + "XXXXXX" + m.slice(-2)
        : m);
  }
}

async function saveWhatsAppSettings(){
  const payload = {
    alert_type: document.getElementById("waAlertType").value,
    alert_time: document.getElementById("waAlertTime").value || null,
    min_confidence: Number(
      document.getElementById("waConfidence").value || 70
    ),
    whatsapp_enabled: true
  };

  const r = await fetch("/api/account/alert-settings", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });

  const d = await r.json();

  alert(
    d.status === "success"
      ? "WhatsApp settings saved."
      : (d.message || "Unable to save settings.")
  );
}

async function testWhatsAppAlert(){
  const r = await fetch(
    "/api/whatsapp/test",
    {method:"POST"}
  );

  const d = await r.json();

  alert(
    d.status === "success"
      ? "Test WhatsApp sent."
      : (d.message || "Test failed.")
  );
}

async function evaluateWhatsAppSignal(){
  const r = await fetch(
    "/api/whatsapp/evaluate",
    {method:"POST"}
  );

  const d = await r.json();

  alert(
    d.status === "sent"
      ? "WhatsApp signal sent."
      : (d.message || d.status)
  );
}

async function logoutNifty(){
  await fetch(
    "/auth/logout",
    {method:"POST"}
  );

  location.href = "/login";
}

loadVerifiedUser();
</script>
